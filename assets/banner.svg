<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Embedded CSS Styles & Keyframe Animations -->
    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .code-line {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 13px;
      }

      /* Animated SVG Elements */
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        50% { transform: translateY(-18px) scale(1.15); opacity: 1; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes waveMotion {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0px); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite; transform-origin: center; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; transform-origin: center; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; transform-origin: center; }
      .glowing-orb { animation: pulseGlow 10s ease-in-out infinite; transform-origin: center; }
      .wave-line { animation: waveMotion 12s ease-in-out infinite; }
      .blink-cursor { animation: cursorBlink 1s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Background Dynamic Orbs (Positioned in background, low opacity) -->
  <g class="glowing-orb">
    <circle cx="200" cy="90" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
    <circle cx="1000" cy="260" r="160" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
    <circle cx="600" cy="180" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Floating Dynamic Tech Cards / Pills in Background Behind Text -->
  <g class="wave-line" opacity="0.4">
    <path d="M-50,280 Q 250,220 550,290 T 1250,240" fill="none" stroke="url(#cyanPurple)" stroke-width="3" opacity="0.6"/>
    <path d="M-50,310 Q 300,350 650,270 T 1250,310" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Animated Particles -->
  <circle class="particle-1" cx="180" cy="240" r="6" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle class="particle-2" cx="960" cy="90" r="8" fill="#c084fc" filter="url(#softGlow)"/>
  <circle class="particle-3" cx="1080" cy="210" r="5" fill="#818cf8" filter="url(#softGlow)"/>
  <circle class="particle-1" cx="120" cy="110" r="4" fill="#34d399" filter="url(#softGlow)"/>

  <!-- Foreground Title Card / Content Area -->
  <!-- Top Tag / Pill -->
  <g transform="translate(80, 52)">
    <rect width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#38bdf8"/>
    <text x="32" y="21" class="badge-text">CLOUD IDE ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title Foreground (Guaranteed High Contrast & Visibility) -->
  <g transform="translate(80, 125)">
    <text x="0" y="0" class="title-text">
      Awesome Cloud <tspan fill="url(#cyanPurple)">Integrated Development</tspan> Environments
    </text>
  </g>

  <!-- Subtitle Foreground -->
  <g transform="translate(80, 168)">
    <text x="0" y="0" class="subtitle-text">
      Curated List of Commercial Cloud IDEs &amp; Open-Source Kubernetes-Native Environments
    </text>
  </g>

  <!-- Floating Feature Badges / Highlights -->
  <g transform="translate(80, 215)">
    <!-- Pill 1: Browser-Based -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">⚡ Browser VS Code</text>
    </g>

    <!-- Pill 2: Dev Containers -->
    <g transform="translate(195, 0)">
      <rect width="190" height="38" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">🐳 Dev Containers</text>
    </g>

    <!-- Pill 3: Self-Hosted -->
    <g transform="translate(400, 0)">
      <rect width="160" height="38" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#c084fc" stroke-width="1.5"/>
      <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">🔒 Self-Hosted</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(575, 0)">
      <rect width="165" height="38" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#34d399" stroke-width="1.5"/>
      <text x="16" y="24" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">🔓 Open Source</text>
    </g>
  </g>

  <!-- Decorative Terminal Window Element on the Right Side -->
  <g transform="translate(840, 50)" filter="url(#softGlow)">
    <rect width="280" height="150" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="280" height="28" rx="10" fill="#1e293b"/>
    <rect width="280" height="10" y="18" fill="#1e293b"/>
    <circle cx="16" cy="14" r="5" fill="#ef4444"/>
    <circle cx="32" cy="14" r="5" fill="#eab308"/>
    <circle cx="48" cy="14" r="5" fill="#22c55e"/>
    <text x="140" y="18" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">cloud-ide ~ dev</text>

    <!-- Terminal Code Text -->
    <text x="16" y="52" fill="#38bdf8" class="code-line">$ devcontainer up</text>
    <text x="16" y="74" fill="#34d399" class="code-line">✔ Workspace initialized</text>
    <text x="16" y="96" fill="#a7f3d0" class="code-line">✔ Port 8080 forwarded</text>
    <text x="16" y="118" fill="#f1f5f9" class="code-line">$ code .<tspan class="blink-cursor" fill="#38bdf8">_</tspan></text>
  </g>
</svg>
